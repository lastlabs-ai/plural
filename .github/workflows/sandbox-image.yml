name: Sandbox image

# Builds ghcr.io/lastlabs-ai/plural-sandbox:{py3.11,py3.12} from docker/sandbox, and
# the -vendor variants with Node.js and the pinned Claude Code and Codex CLIs.
# Every change builds them and checks they can isolate the App host; only a manual
# run with push enabled publishes them.

on:
  pull_request:
    paths:
      - "docker/sandbox/**"
      - ".github/workflows/sandbox-image.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        target: ["base", "vendor"]
    env:
      TAG: py${{ matrix.python }}${{ matrix.target == 'vendor' && '-vendor' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: docker/sandbox
          target: ${{ matrix.target }}
          build-args: PYTHON_VERSION=${{ matrix.python }}
          load: true
          tags: plural-sandbox:${{ env.TAG }}
      - name: Check the tools isolation needs
        run: |
          docker run --rm plural-sandbox:$TAG sh -c \
            'command -v sudo && command -v useradd && command -v git && command -v curl \
             && python -c "import httpx, pydantic, typer, yaml"'
      - name: Check the pinned vendor CLIs
        if: matrix.target == 'vendor'
        run: |
          claude=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' docker/sandbox/Dockerfile)
          codex=$(sed -n 's/^ARG CODEX_VERSION=//p' docker/sandbox/Dockerfile)
          docker run --rm --network none plural-sandbox:$TAG sh -c \
            "claude --version | grep -F '$claude' && codex --version | grep -F '$codex'"
      - name: Log in to ghcr.io
        if: github.event_name == 'workflow_dispatch' && inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'workflow_dispatch' && inputs.push
        uses: docker/build-push-action@v7
        with:
          context: docker/sandbox
          target: ${{ matrix.target }}
          build-args: PYTHON_VERSION=${{ matrix.python }}
          push: true
          tags: ghcr.io/lastlabs-ai/plural-sandbox:${{ env.TAG }}
