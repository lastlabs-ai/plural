name: Sandbox image

# Builds ghcr.io/lastlabs-ai/plural-sandbox:{py3.11,py3.12} from docker/sandbox.
# Every change builds it and checks it can isolate the App host; only a manual run
# with push enabled publishes it.

on:
  pull_request:
    paths:
      - "docker/sandbox/**"
      - ".github/workflows/sandbox-image.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: docker/sandbox
          build-args: PYTHON_VERSION=${{ matrix.python }}
          load: true
          tags: plural-sandbox:py${{ matrix.python }}
      - name: Check the tools isolation needs
        run: |
          docker run --rm plural-sandbox:py${{ matrix.python }} sh -c \
            'command -v sudo && command -v useradd && command -v git && command -v curl \
             && python -c "import httpx, pydantic, typer, yaml"'
      - name: Log in to ghcr.io
        if: github.event_name == 'workflow_dispatch' && inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'workflow_dispatch' && inputs.push
        uses: docker/build-push-action@v7
        with:
          context: docker/sandbox
          build-args: PYTHON_VERSION=${{ matrix.python }}
          push: true
          tags: ghcr.io/lastlabs-ai/plural-sandbox:py${{ matrix.python }}
