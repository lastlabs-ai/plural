site_name: Plural
site_description: Author environments, evaluate agents, and keep a record of what happened.
site_url: https://lastlabs-ai.github.io/plural/
repo_url: https://github.com/lastlabs-ai/plural
repo_name: lastlabs-ai/plural

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - scripts/mkdocs_tabs.py

plugins:
  - search
  - llmstxt:
      markdown_description: Build reproducible agent evaluations, run them, and inspect the evidence.
      sections:
        Start:
          - index.md
          - getting-started.md
          - getting-started/concepts.md
          - start/index.md
          - start/from-traces.md
          - start/from-a-system.md
        Build:
          - project/environments.md
          - project/runtimes.md
          - project/tasks.md
          - project/verifiers.md
          - project/harnesses.md
          - project/agents.md
          - project/external-agents.md
          - project/external-tracing.md
          - project/benchmarks.md
          - project/multi-agent.md
        Run:
          - running/jobs.md
          - running/trials.md
          - running/artifacts.md
          - running/reviews.md
          - running/training.md
        Platform:
          - platform/runs.md
          - guides/studio-sync.md
          - platform/publish.md
        Interfaces:
          - sdk/evaluation.md
          - cli/evaluation.md
          - interfaces/yaml.md
        Tutorials:
          - tutorials/support-queue.md
          - tutorials/wordle.md
        Operations:
          - reference/integrations.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Start:
      - Overview: index.md
      - Quickstart: getting-started.md
      - Core concepts: getting-started/concepts.md
      - Create an Environment:
          - start/index.md
          - From traces: start/from-traces.md
          - From a system: start/from-a-system.md
  - Build:
      - Apps: concepts/apps.md
      - Environments: project/environments.md
      - Build an MCP server: guides/build-mcp-server.md
      - Connect an MCP server: guides/connect-mcp-server.md
      - Connect an External Agent: guides/connect-external-agent.md
      - Runtimes: project/runtimes.md
      - Tasks: project/tasks.md
      - Verifiers: project/verifiers.md
      - Harnesses: project/harnesses.md
      - Agents: project/agents.md
      - External Agents: project/external-agents.md
      - Trace an External Agent: project/external-tracing.md
      - Benchmarks: project/benchmarks.md
      - Several Agents in one Task: project/multi-agent.md
  - Run:
      - Jobs: running/jobs.md
      - Trials and trajectories: running/trials.md
      - Sessions: running/sessions.md
      - Artifacts and evidence: running/artifacts.md
      - Reviews: running/reviews.md
      - Training and RL: running/training.md
  - Platform:
      - Record runs and run in the cloud: platform/runs.md
      - Push and pull: guides/studio-sync.md
      - Publish to the Hub: platform/publish.md
  - Interfaces:
      - Python SDK: sdk/evaluation.md
      - CLI: cli/evaluation.md
      - YAML and serialization: interfaces/yaml.md
  - Tutorials:
      - Support queue: tutorials/support-queue.md
      - Wordle: tutorials/wordle.md
  - Operations:
      - Providers and integrations: reference/integrations.md
