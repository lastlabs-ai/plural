site_name: Plural
site_description: Build environments, evaluate models and harnesses, and manage agents with the Plural SDK and CLI.
site_url: https://lastlabs-ai.github.io/plural/
repo_url: https://github.com/lastlabs-ai/plural
repo_name: lastlabs-ai/plural

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - llmstxt:
      markdown_description: Beginner-to-advanced Plural SDK, CLI, authentication, evaluation, and Plural Intel workflows.
      sections:
        Getting started:
          - getting-started/*.md
          - quickstart.md
        Walkthroughs:
          - tutorials/*.md
        SDK:
          - sdk/*.md
        CLI:
          - cli/*.md
        Concepts:
          - concepts/*.md
        Guides:
          - guides/*.md
        Operations:
          - operations/*.md
        Migration:
          - migration/*.md
        Reference:
          - reference/*.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Install and authenticate: getting-started/setup.md
      - Understand the pieces: getting-started/concepts.md
      - Your first evaluation: quickstart.md
  - Walkthroughs:
      - Build and evaluate an environment: tutorials/sdk-walkthrough.md
      - Run your first CLI job: tutorials/cli-walkthrough.md
      - Add native actions and verification: tutorials/package-tools.md
      - Fetch and update Plural Intel objects: guides/push-to-plural.md
      - Traces and datasets: tutorials/traces-and-datasets.md
  - SDK:
      - Model calls and routing: sdk/client.md
      - Run package jobs from Python: sdk/package-jobs.md
      - Hosted revisions and jobs: sdk/hosted-advanced.md
      - Python API reference: reference/api.md
  - CLI:
      - Configuration and authentication: cli/index.md
      - All commands and options: reference/cli-commands.md
  - Advanced guides:
      - Stateful environments and replay: guides/write-environment.md
      - Benchmark methodology and regression checks: guides/benchmark-models.md
      - Jobs, runtimes, and recovery: guides/jobs.md
      - Harness packages and adapters: guides/harnesses.md
      - Sandbox provider plugins: guides/provider-plugins.md
      - Plural Intel package sync: guides/studio-sync.md
      - CI evaluations: guides/ci.md
      - Streaming, tools, structured output: guides/capabilities.md
      - Routing and provider examples: guides/routing-examples.md
      - Capture traces from an app: guides/capture-traces.md
      - Production traffic to a dataset: guides/production-to-dataset.md
      - Redact PII: guides/redact-pii.md
      - Export OpenTelemetry: guides/export-otel.md
      - Azure and Bedrock: guides/cloud-providers.md
      - Add your own provider: guides/add-provider.md
      - Migrate from OpenRouter: guides/migrate-openrouter.md
  - Concepts:
      - Environment lifecycle: concepts/environment.md
      - Native actions: concepts/native-actions.md
      - Harness stamping: concepts/harness-stamping.md
      - Execution capabilities: concepts/execution-capabilities.md
      - Agent templates and instances: concepts/agent-instances.md
      - Observability: concepts/observability.md
      - Hub: concepts/hub.md
      - Packages, jobs, and trials: concepts/execution.md
      - Benchmark: concepts/benchmark.md
      - Trace: concepts/trace.md
      - Dataset: concepts/dataset.md
      - Routing policy: concepts/routing.md
      - Sink: concepts/sink.md
  - Operations:
      - Security and trust: operations/security.md
      - Troubleshooting: operations/troubleshooting.md
      - Known limitations: reference/limitations.md
  - Reference:
      - SDK and CLI coverage: reference/feature-map.md
      - Manifest fields: reference/manifests.md
      - Package JSON schemas: reference/schemas.md
      - Trace JSON schema: reference/trace-schema.md
      - Capability table: reference/capabilities.md
      - Glossary: reference/glossary.md
      - Version migration: migration/v1.md
