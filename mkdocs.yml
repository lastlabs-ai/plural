site_name: Plural
site_description: Author environments, evaluate agents, and keep a record of what happened.
site_url: https://lastlabs-ai.github.io/plural/
repo_url: https://github.com/lastlabs-ai/plural
repo_name: lastlabs-ai/plural

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - llmstxt:
      markdown_description: Author an Environment, pin Tasks and Verifiers, run Agents, and read the Trace.
      sections:
        Start:
          - index.md
          - motivation.md
          - getting-started.md
        Project:
          - project/*.md
        Running:
          - running/*.md
        Tutorial:
          - tutorials/wordle.md
        Reference:
          - reference/definitions.md
          - reference/cli-commands.md
          - reference/glossary.md
          - reference/integrations.md
          - reference/api.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Start:
      - Overview: index.md
      - Motivation: motivation.md
      - Getting started: getting-started.md
  - Project:
      - Environments: project/environments.md
      - Tasks: project/tasks.md
      - Verifiers: project/verifiers.md
      - Agents: project/agents.md
      - Benchmarks: project/benchmarks.md
  - Running:
      - Jobs: running/jobs.md
      - Traces: running/traces.md
      - Reviews: running/reviews.md
  - Tutorial:
      - Wordle: tutorials/wordle.md
  - Reference:
      - Definitions: reference/definitions.md
      - CLI: reference/cli-commands.md
      - Glossary: reference/glossary.md
      - Integrations: reference/integrations.md
      - API: reference/api.md
