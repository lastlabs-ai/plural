[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "plural"
dynamic = ["version"]
description = "Build environments, evaluate agents, compare models, and capture traces."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Plural" }]
keywords = [
  "llm",
  "routing",
  "openrouter",
  "tracing",
  "environments",
  "benchmarks",
  "ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "tomli>=2.0,<3; python_version < '3.11'",
  "typer>=0.12,<1",
]

[project.scripts]
plural = "plural.cli:main"

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
]
keyring = [
  "keyring>=25,<26",
]
daytona = [
  "daytona>=0.207,<1",
]
all = [
  "plural[daytona,keyring,otel]",
]

[project.urls]
Homepage = "https://github.com/lastlabs-ai/plural"
Documentation = "https://lastlabs-ai.github.io/plural/"
Repository = "https://github.com/lastlabs-ai/plural"
Issues = "https://github.com/lastlabs-ai/plural/issues"
Changelog = "https://github.com/lastlabs-ai/plural/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.9",
  "mypy>=1.14",
  "jsonschema>=4.26.0",
  "tomli>=2.0,<3",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "mkdocs-llmstxt>=0.2",
  "mike>=2.1",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/plural"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/mkdocs.yml",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.format]
docstring-code-format = true
exclude = ["docs/**", "*.md"]

[tool.ruff.lint]
preview = true
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "D",
  "DOC",
]
ignore = [
  "D100", # package/module docstrings covered by hand-written docs
  "D104",
  "D105",
  "D107",
  # DOC501/502 mis-detect `raise helper()` factory patterns used by providers.
  "DOC501",
  "DOC502",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/plural/cli/**" = ["B008", "DOC201"]
# Scaffold text: each PLURAL-TODO line is reported whole as a validation message.
"src/plural/project/templates.py" = ["E501"]
"src/plural/sandbox/**" = ["D", "DOC"]
"src/plural/harness/**" = ["D", "DOC"]
"src/plural/execution/**" = ["D", "DOC"]
"tests/**" = ["D", "DOC"]
"examples/**" = ["D", "DOC", "E501"]
"docs/**" = ["D", "DOC"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["plural"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "daytona.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "--doctest-modules",
  "--ignore=docs",
  "--ignore=examples",
  "--ignore=tests/typing",
]
markers = [
  "live: tests that call real provider APIs (deselect with -m 'not live')",
  "docker: opt-in tests that use the local Docker daemon",
  "daytona: opt-in tests that use Daytona credentials",
]
filterwarnings = [
  "error",
  "ignore::pytest.PytestUnraisableExceptionWarning",
  "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["plural"]
branch = true
