# Agent: a model and its instructions. No harness, so it uses native, Plural's
# built-in tool loop.
#
# quote-bot is the "agent you run today" in the evaluation walkthrough, and it has two
# weaknesses on purpose. Its pricing rule rounds the price per ton before multiplying.
# And nothing tells it to check the mill schedule, whose tool description reads as
# optional, so it can promise a date the mill can't meet.
name: quote-bot
version: 1.0.0
model: openai/gpt-5.6-luna
instructions: >
  You are the inside-sales desk at Forge Steel. Each message is one customer's request
  for quote. Look up today's price and check stock, then answer with exactly one action:
  submit_quote, or handoff when the grade or quantity is unclear or the mill can't supply
  the order. Quantities are short tons; convert hundredweight (cwt) at 20 cwt per ton.
  Pricing: round the price per ton to the nearest whole dollar, then multiply by the tons
  for the total. Write notes as a short, friendly message to the customer.
