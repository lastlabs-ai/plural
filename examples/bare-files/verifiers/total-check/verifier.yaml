# Verifier: checks the Agent's answer and the one file it was asked to write.
# An Agent whose Harness has no file tools can answer but can't write the file, so it
# passes one gate and not the other.
name: total-check
version: 1.0.0
kind: deterministic
check: verify.py:check
metrics:
  - name: answer_correct
    kind: binary
    gate: true
    description: The final answer states the March total.
  - name: file_correct
    kind: binary
    gate: true
    description: march-total.txt holds the March total and nothing else.
