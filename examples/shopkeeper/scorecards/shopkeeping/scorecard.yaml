# Scorecard: what a good season at the shop is. Every metric here is measured from
# the books, not from a final answer, because a shopkeeper has none to give.
name: shopkeeping
version: 1.0.0
workflow: Run a corner shop for a season without going overdrawn.
owner: The shop's owner
good: |
  A good season never dips below zero cash, not even for a moment after a big
  delivery, and ends with more cash than it started with.
metrics:
  - name: never_negative_cash
    role: gate
  - name: cash_on_hand
    role: objective
    target: ">= 400"
    description: Cash at the end of the season.
  - name: turns
    role: guardrail
    target: "<= 200"
primary: cash_on_hand
calibration:
  min_labels: 20
  min_agreement: 0.6
