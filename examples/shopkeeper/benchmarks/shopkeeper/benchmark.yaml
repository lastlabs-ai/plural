# Benchmark: a fixed set of Tasks and the rules for ranking results.
# It ranks on cash_on_hand, a running metric: the cash at the end of each season. The
# score still records profit against each Task's target, and never_negative_cash is a
# gate on the shopkeeper Scorecard.
name: shopkeeper
version: 1.0.0
description: Three seasons at a corner shop.
purpose: >-
  Checks that an Agent keeps a business solvent over many steps and grows its cash,
  with no final answer to grade.
tasks:
  - shop-001
  - shop-002
  - shop-003
primary_metric: cash_on_hand
scorecard: shopkeeping
scoring:
  metric: Season profit
  description: Profit against each season's target, 0 for a shop that ever went below zero cash.
  aggregation: weighted_mean
  score_range: [0.0, 1.0]
  success_threshold: 1.0
  agent_failure: zero
  infrastructure_error: exclude
