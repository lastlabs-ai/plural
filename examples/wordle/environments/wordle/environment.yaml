# Environment: identity, resources, runtime, and settings.
# Behavior (actions, state, observations, rewards) is Python in environment.py.
# README.md explains both to the people who use this Environment.
name: wordle
version: 0.1.0
description: Guess a hidden five-letter word. Each guess is marked correct, present, or absent.
overview: Six guesses. The secret stays on State, and the Agent only sees the board.
python: environment.py:Wordle
readme: README.md

# Files staged into the runtime, relative to this directory.
resources: []
#  - resources/policy.md

# local runs the Environment as a trusted subprocess on this machine. For
# container isolation use provider: docker; plural run adds Plural to the image.
runtime:
  provider: local

# Settings: which Agent harnesses may run here, and per-Trial limits.
harness_policy:
  mode: allow_all
limits:
  max_turns: 6
  max_seconds: 120
