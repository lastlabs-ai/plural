# Environment: the Apps an Agent works with, plus where they run and the limits.
# Wordle is one Python App: the Wordle class in environment.py.
name: wordle
version: 1.0.0
description: Guess a hidden five-letter word. Each guess is marked correct, present, or absent.
overview: Six guesses. The secret stays on State, and the Agent only sees what each guess returns.
python: environment.py:Wordle
readme: README.md

# Files every Task starts with. The App reads words.txt from its own folder; listing
# it here also puts it in /workspace/resources, where a Harness may read it.
resources:
  - words.txt

# local runs on this machine as a trusted subprocess, so the project runs anywhere.
# Use provider: docker to run each Trial in a container instead.
runtime:
  provider: local

limits:
  max_turns: 8
  max_seconds: 120
