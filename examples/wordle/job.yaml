kind: job
source:
  kind: benchmark
  name: wordle
  version: 1.0.0
  tasks:
  - kind: task
    name: easy-01
    version: 0.1.0
    instructions: 'Guess the hidden five-letter word from: crane, slate, audio, point,
      heart. Call guess one word at a time and stop when solved.'
    goals: []
    info: null
    metadata: {}
    environment:
      kind: environment
      python: wordle.py:Wordle
      name: wordle
      version: 0.1.0
      description: ''
      overview: Guess a hidden five-letter word in six tries.
      readme: ''
      resources: []
      runtime:
        provider: local
        placement: {}
        variables: []
        network: public
        network_allowlist: []
        resources: {}
        read_only_root: false
        targets:
        - local
        persistent: false
        compose: false
        extra_capabilities: []
        timeout_seconds: 300.0
        build_timeout_sec: 600.0
        allow_unsafe_local: true
      secrets: []
      guardrails: []
      harness_policy:
        mode: allow_all
        allowed_harnesses: []
        denied_capabilities: []
      limits:
        max_turns: 8
        max_seconds: 120.0
      metadata: {}
    verifiers:
    - name: solved
      version: 0.1.0
      criteria: []
      weight: 1.0
      metadata: {}
      kind: deterministic
      runtime:
        provider: docker
        network: public
        network_allowlist: []
        resources: {}
        timeout_seconds: 60.0
      result_path: verifier-result.json
      evidence_required: true
      check:
        python: verify.py:solved
    - name: turns
      version: 0.1.0
      criteria: []
      weight: 1.0
      metadata: {}
      kind: deterministic
      runtime:
        provider: docker
        network: public
        network_allowlist: []
        resources: {}
        timeout_seconds: 60.0
      result_path: verifier-result.json
      evidence_required: true
      check:
        python: verify.py:turns
    resources: []
    initial_state: {}
    reset_options: {}
  primary_metric: score
  description: ''
  metadata: {}
agents:
- kind: agent
  model: openai/gpt-5.6-luna
  name: gpt-5.6-luna
  version: 0.1.0
  instructions: Play Wordle with the guess action. Stop as soon as the board is solved.
  fallback_models: []
  auth_mode: environment
  secret_names: []
  metadata: {}
mode: eval
attempts: 1
concurrency: 1
per_runtime_concurrency: 1
priority: 0
retry:
  max_retries: 0
  initial_backoff_seconds: 0.25
  max_backoff_seconds: 10.0
  multiplier: 2.0
  retryable_codes:
  - rate_limited
  - provider_unavailable
  - timeout
  - runtime_unavailable
