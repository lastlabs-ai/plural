kind: task
name: ticket-1
version: 0.1.0
instructions: Inspect the open ticket, categorize it, draft a concise customer response,
  then resolve it. Stop when the Environment reports done.
goals:
- Use the support policy returned by inspect_ticket.
- Resolve the ticket only after categorizing it and drafting a response.
info:
  ticket_id: ticket-1
metadata:
  split: evaluation
environment:
  kind: environment
  python: ../environment/world.py:SupportQueue
  name: support-queue
  version: 1.0.0
  description: ''
  overview: Inspect a customer ticket, categorize it, draft a reply, and resolve it.
  readme: ''
  resources:
  - kind: data
    name: policy.md
    path: policy.md
    content_type: text/markdown
    config: {}
    description: ''
    delivery: source
  runtime:
    provider: local
    placement: {}
    variables: []
    network: public
    network_allowlist: []
    resources: {}
    read_only_root: false
    targets:
    - local
    persistent: false
    compose: false
    extra_capabilities: []
    timeout_seconds: 300.0
    build_timeout_sec: 600.0
    allow_unsafe_local: true
  secrets: []
  guardrails: []
  harness_policy:
    mode: allow_all
    allowed_harnesses: []
    denied_capabilities: []
  limits:
    max_turns: 6
    max_seconds: 120.0
  metadata: {}
verifiers:
- name: correct-category
  version: 0.1.0
  criteria: []
  weight: 1.0
  metadata: {}
  kind: deterministic
  runtime:
    provider: docker
    network: public
    network_allowlist: []
    resources: {}
    timeout_seconds: 60.0
  result_path: verifier-result.json
  evidence_required: true
  check:
    python: ../verifiers/correct.py:correct_category
resources: []
initial_state: {}
reset_options: {}
