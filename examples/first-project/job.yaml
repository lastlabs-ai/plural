kind: job
source:
  kind: task
  name: ticket-1
  version: 0.1.0
  instructions: Inspect the open ticket, categorize it, draft a concise customer response,
    then resolve it. Stop when the Environment reports done.
  goals:
  - Use the support policy returned by inspect_ticket.
  - Resolve the ticket only after categorizing it and drafting a response.
  info:
    ticket_id: ticket-1
  metadata:
    split: evaluation
  environment:
    kind: environment
    python: environment/world.py:SupportQueue
    name: support-queue
    version: 1.0.0
    description: ''
    overview: Inspect a customer ticket, categorize it, draft a reply, and resolve
      it.
    readme: ''
    resources:
    - kind: data
      name: support-policy
      path: policy.md
      uri: null
      digest: null
      content_type: text/markdown
      config: {}
    runtime:
      provider: local
      placement: {}
      image: null
      snapshot: null
      declarative_image: null
      build_context: null
      dockerfile: null
      network: full
      network_allowlist: []
      resources:
        cpu: null
        memory_mb: null
        pids: null
        disk_mb: null
      read_only_root: false
      targets:
      - local
      persistent: false
      compose: false
      extra_capabilities: []
      timeout_seconds: 300.0
      allow_unsafe_local: true
    secrets: []
    guardrails: []
    harness_policy:
      mode: allow_all
      allowed_harnesses: []
      allowed_capabilities: null
      denied_capabilities: []
    limits:
      max_turns: 6
      max_seconds: 120.0
      max_cost_usd: null
    metadata: {}
    reset_command:
    - python
    - commands.py
    - reset
    package:
      command:
      - python
      - commands.py
      source: environment
      digest: sha256:b1b269a4a46f925a29dfb6ced5920848e7716859a99cffc7fa4fafcf4a59c6a3
  verifiers:
  - name: correct-category
    version: 0.1.0
    info: null
    criteria: []
    evidence:
      artifacts: []
      state_paths:
      - expected
      observation_paths:
      - category
      - draft_reply
      - status
      - done
      include_hidden_state: true
    weight: 1.0
    metadata: {}
    kind: deterministic
    check:
    - python
    - -c
    - "\"\"\"Check the actual final Environment state, not the model's final claim.\"\
      \"\"\n\nimport json\nfrom pathlib import Path\n\npayload = json.loads(Path(\"\
      .plural/verifier-input.json\").read_text())\nview = payload[\"environment_view\"\
      ]\nobservation = view[\"observation\"]\nstate = view[\"state\"]\ncorrect = (\n\
      \    observation[\"done\"]\n    and observation[\"category\"] == state[\"expected\"\
      ]\n    and bool(observation[\"draft_reply\"].strip())\n)\nreward = float(correct)\n\
      Path(\"verifier-result.json\").write_text(\n    json.dumps(\n        {\n   \
      \         \"reward\": reward,\n            \"scores\": {\n                \"\
      correct_category\": reward,\n                \"response_drafted\": float(bool(observation[\"\
      draft_reply\"])),\n            },\n            \"evidence\": [\n           \
      \     f\"status={observation['status']}\",\n                f\"category={observation['category']}\"\
      ,\n                f\"correct={correct}\",\n            ],\n            \"feedback\"\
      : \"Correct category and a response was drafted.\"\n            if correct\n\
      \            else \"The ticket was not resolved with the correct category and\
      \ a response.\",\n        }\n    )\n    + \"\\n\"\n)\n"
    runtime:
      provider: local
      image: null
      network: full
      network_allowlist: []
      resources:
        cpu: null
        memory_mb: null
        pids: null
        disk_mb: null
      timeout_seconds: 60.0
    result_path: verifier-result.json
    evidence_required: true
  resources: []
  initial_state: {}
  reset_options: {}
agents:
- kind: agent
  model: openai/gpt-5.6-luna
  name: careful
  version: 0.1.0
  provider: null
  instructions: Inspect the ticket before categorizing it. Use the Environment actions.
  fallback_models: []
  temperature: null
  max_tokens: null
  auth_mode: environment
  secret_names:
  - OPENAI_API_KEY
  metadata: {}
mode: eval
attempts: 1
concurrency: 1
per_runtime_concurrency: 1
priority: 0
retry:
  max_retries: 0
  initial_backoff_seconds: 0.25
  max_backoff_seconds: 10.0
  multiplier: 2.0
  retryable_codes:
  - rate_limited
  - provider_unavailable
  - timeout
  - runtime_unavailable
