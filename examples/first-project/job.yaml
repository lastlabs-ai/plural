kind: job
source:
  kind: task
  name: ticket-1
  version: 0.1.0
  instructions: Inspect the open ticket, categorize it, draft a concise customer response,
    then resolve it. Stop when the Environment reports done.
  goals:
  - Use the support policy returned by inspect_ticket.
  - Resolve the ticket only after categorizing it and drafting a response.
  info:
    ticket_id: ticket-1
  metadata:
    split: evaluation
  environment:
    kind: environment
    python: environment/world.py:SupportQueue
    name: support-queue
    version: 1.0.0
    description: ''
    overview: Inspect a customer ticket, categorize it, draft a reply, and resolve
      it.
    readme: ''
    resources:
    - kind: data
      name: support-policy
      path: policy.md
      uri: null
      digest: null
      content_type: text/markdown
      config: {}
    runtime:
      provider: local
      placement: {}
      image: null
      snapshot: null
      declarative_image: null
      build_context: null
      dockerfile: null
      network: public
      network_allowlist: []
      resources:
        cpu: null
        memory_mb: null
        pids: null
        disk_mb: null
        storage_mb: null
      read_only_root: false
      targets:
      - local
      persistent: false
      compose: false
      extra_capabilities: []
      timeout_seconds: 300.0
      build_timeout_sec: 600.0
      allow_unsafe_local: true
    secrets: []
    guardrails: []
    harness_policy:
      mode: allow_all
      allowed_harnesses: []
      allowed_capabilities: null
      denied_capabilities: []
    limits:
      max_turns: 6
      max_seconds: 120.0
      max_cost_usd: null
    metadata: {}
  verifiers:
  - name: correct-category
    version: 0.1.0
    info: null
    criteria: []
    weight: 1.0
    metadata: {}
    kind: deterministic
    runtime:
      provider: docker
      image: null
      network: public
      network_allowlist: []
      resources:
        cpu: null
        memory_mb: null
        pids: null
        disk_mb: null
        storage_mb: null
      timeout_seconds: 60.0
    result_path: verifier-result.json
    evidence_required: true
    check:
      python: verifiers/correct.py:correct_category
  resources: []
  initial_state: {}
  reset_options: {}
agents:
- kind: agent
  model: openai/gpt-5.6-luna
  name: careful
  version: 0.1.0
  provider: null
  instructions: Inspect the ticket before categorizing it. Use the Environment actions.
  fallback_models: []
  temperature: null
  max_tokens: null
  auth_mode: environment
  secret_names: []
  metadata: {}
mode: eval
attempts: 1
concurrency: 1
per_runtime_concurrency: 1
priority: 0
retry:
  max_retries: 0
  initial_backoff_seconds: 0.25
  max_backoff_seconds: 10.0
  multiplier: 2.0
  retryable_codes:
  - rate_limited
  - provider_unavailable
  - timeout
  - runtime_unavailable
