# Agent: a small model on native, Plural's built-in tool loop. In a party it waits for
# its seat's turn and sees only its seat's view.
name: negotiator-luna
version: 1.0.0
model: openai/gpt-5.6-luna
instructions: >
  You negotiate on behalf of your side. Read your view, then make one move: offer,
  accept, or walk away. Keep messages short.
